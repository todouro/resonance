name: Verify music player
permissions:
  contents: read
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'cleanup/**']
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Verify the committed Cargo lockfile is present
        run: test -f src-tauri/Cargo.lock
      - name: Rust unit tests (std-only download logic)
        run: |
          mkdir -p "$RUNNER_TEMP/rt"
          printf '#[path = "%s/src-tauri/src/util.rs"] mod util;\n#[path = "%s/src-tauri/src/runner.rs"] mod runner;\nfn main() {}\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/rt/main.rs"
          rustc --edition 2021 --test "$RUNNER_TEMP/rt/main.rs" -o "$RUNNER_TEMP/rt/tests"
          "$RUNNER_TEMP/rt/tests" --test-threads=1

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Tauri Windows desktop installer
        run: npx tauri build
      - name: Smoke-test per-user installation and app startup
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "The NSIS setup.exe was not produced by the build."
          }
          ./scripts/windows-install-smoke.ps1 -InstallerPath $installer.FullName
      - name: Upload Windows desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-Windows-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/resonance.exe
          if-no-files-found: error
