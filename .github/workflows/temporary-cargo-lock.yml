name: Temporary Cargo lock generation
on:
  push:
    branches:
      - tooling/generate-cargo-lock-temp
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit lockfile to stability branch
        shell: bash
        run: |
          cp src-tauri/Cargo.lock "$RUNNER_TEMP/resonance-Cargo.lock"
          git fetch origin cleanup/stability-pass
          git checkout -B cleanup/stability-pass FETCH_HEAD
          cp "$RUNNER_TEMP/resonance-Cargo.lock" src-tauri/Cargo.lock
          git add src-tauri/Cargo.lock
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: commit Cargo lockfile"
          git push origin HEAD:refs/heads/cleanup/stability-pass
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resonance-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
